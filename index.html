<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Giving365 Copilot</title>
    <link rel="icon" href="images/logo.png" type="image/png" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: #ffffff; /* Match bot background */
        font-family: 'Segoe UI', sans-serif;
      }

      header {
        background-color: #005560; /* Matching Chat Header */
        color: white;
        padding: 16px 32px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      header img {
        height: 36px;
      }

      header h2 {
        margin: 0;
        font-size: 22px;
      }

      main {
        display: flex;
        justify-content: center;
        padding: 60px 16px 40px;
      }

      iframe {
        width: 100%;
        max-width: 800px;
        height: 620px;
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="images/logo.png" alt="Giving365 Logo" />
      <h2>Giving365 Agent</h2>
    </header>

    <main>
      <iframe
        src="https://copilotstudio.microsoft.com/environments/Default-b7e91da2-13bb-4f40-85c1-fe13df900913/bots/cr432_agent1/webchat?__version__=2"
        allow="clipboard-write"
      ></iframe>
    </main>
  </body>
</html>
